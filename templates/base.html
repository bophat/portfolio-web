<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ profile.title if profile else 'Junior Backend & Data Engineer Portfolio' }}">
    <title>{{ profile.name if profile else 'Alex Chen' }} | {{ profile.title if profile else 'Junior Backend & Data
        Engineer' }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css?v=2">
    {% block extra_css %}{% endblock %}
</head>

<body data-theme="{{ profile.theme_preference if profile else 'default' }}"
    data-layout="{{ profile.layout_preference if profile else 'standard' }}">
    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}
</body>

</html>
