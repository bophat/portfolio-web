<div class="toast" id="toast"></div>

<script>
    // Utilities
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + type + ' show';
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
    });

    // Profile Logic
    document.getElementById('saveProfileBtn').addEventListener('click', async () => {
        const data = {
            name: document.getElementById('profileName').value,
            title: document.getElementById('profileTitle').value,
            summary: document.getElementById('profileSummary').value,
            hero_badge: document.getElementById('profileBadge').value,
            stats_projects: document.getElementById('profileProjects').value,
            stats_technologies: document.getElementById('profileTech').value,
            theme_preference: document.getElementById('profileTheme').value,
            layout_preference: document.getElementById('profileLayout').value
        };

        try {
            const response = await fetch('/api/profile/', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showToast('Profile updated successfully!');
            } else {
                showToast('Failed to update profile', 'error');
            }
        } catch (error) {
            showToast('Error updating profile', 'error');
        }
    });

    // --- Skill Logic ---
    function openSkillModal(skill = null) {
        const modal = document.getElementById('skillModal');
        const title = document.getElementById('skillModalTitle');
        const idInput = document.getElementById('skillId');

        document.getElementById('skillForm').reset();

        if (skill) {
            title.textContent = 'Edit Skill';
            idInput.value = skill.id;
            document.getElementById('skillCategory').value = skill.category;
            document.getElementById('skillName').value = skill.name;
            document.getElementById('skillLevel').value = skill.level;
            document.getElementById('skillIsLearning').checked = skill.is_learning;
        } else {
            title.textContent = 'Add Skill';
            idInput.value = '';
        }

        modal.classList.add('active');
    }

    document.getElementById('skillForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('skillId').value;
        const isEdit = !!id;

        const data = {
            category: document.getElementById('skillCategory').value,
            name: document.getElementById('skillName').value,
            level: parseInt(document.getElementById('skillLevel').value),
            is_learning: document.getElementById('skillIsLearning').checked,
            category_icon: "",
            sort_order: 10
        };

        const url = isEdit ? `/api/skills/${id}` : '/api/skills/';
        const method = isEdit ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showToast(`Skill ${isEdit ? 'updated' : 'added'} successfully!`);
                closeModal('skillModal');
                setTimeout(() => location.reload(), 1000);
            } else {
                showToast('Operation failed', 'error');
            }
        } catch (e) {
            showToast('Error saving skill', 'error');
        }
    });

    async function deleteSkill(id) {
        if (!confirm('Are you sure you want to delete this skill?')) return;
        const response = await fetch(`/api/skills/${id}`, { method: 'DELETE' });
        if (response.ok) {
            showToast('Skill deleted');
            setTimeout(() => location.reload(), 500);
        } else {
            showToast('Delete failed', 'error');
        }
    }

    // --- Project Logic ---
    function openProjectModal(project = null) {
        const modal = document.getElementById('projectModal');
        const title = document.getElementById('projectModalTitle');
        const idInput = document.getElementById('projectId');

        document.getElementById('projectForm').reset();

        if (project) {
            title.textContent = 'Edit Project';
            idInput.value = project.id;
            document.getElementById('projectTitle').value = project.title;
            document.getElementById('projectType').value = project.project_type;
            document.getElementById('projectDescription').value = project.description;
            if (project.tech_tags_list) {
                document.getElementById('projectTechTags').value = project.tech_tags_list.join(', ');
            }
            document.getElementById('projectGitHub').value = project.github_link || '';
            document.getElementById('projectLink').value = project.project_link || '';
        } else {
            title.textContent = 'Add Project';
            idInput.value = '';
        }

        modal.classList.add('active');
    }

    document.getElementById('projectForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('projectId').value;
        const isEdit = !!id;

        const techTagsRaw = document.getElementById('projectTechTags').value;
        const techTagsList = techTagsRaw.split(',').map(item => item.trim()).filter(Boolean);

        const data = {
            title: document.getElementById('projectTitle').value,
            project_type: document.getElementById('projectType').value,
            description: document.getElementById('projectDescription').value,
            tech_tags: techTagsList,
            project_link: document.getElementById('projectLink').value,
            github_link: document.getElementById('projectGitHub').value,
            sort_order: 10,
            what_learned: [],
            image_url: ""
        };

        const url = isEdit ? `/api/projects/${id}` : '/api/projects/';
        const method = isEdit ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showToast(`Project ${isEdit ? 'updated' : 'added'} successfully!`);
                closeModal('projectModal');
                setTimeout(() => location.reload(), 1000);
            } else {
                console.error(await response.text());
                showToast('Operation failed', 'error');
            }
        } catch (e) {
            showToast('Error saving project', 'error');
        }
    });

    async function deleteProject(id) {
        if (!confirm('Are you sure you want to delete this project?')) return;
        const response = await fetch(`/api/projects/${id}`, { method: 'DELETE' });
        if (response.ok) {
            showToast('Project deleted');
            setTimeout(() => location.reload(), 500);
        } else {
            showToast('Delete failed', 'error');
        }
    }

    // --- Timeline Logic ---
    function openTimelineModal(item = null) {
        const modal = document.getElementById('timelineModal');
        const title = document.getElementById('timelineModalTitle');
        const idInput = document.getElementById('timelineId');

        document.getElementById('timelineForm').reset();

        if (item) {
            title.textContent = 'Edit Timeline Item';
            idInput.value = item.id;
            document.getElementById('timelineType').value = item.item_type;
            document.getElementById('timelinePeriod').value = item.period;
            document.getElementById('timelineTitle').value = item.title;
            document.getElementById('timelineOrg').value = item.organization;
            document.getElementById('timelineDesc').value = item.description;
            document.getElementById('timelineIcon').value = item.icon || 'briefcase';
        } else {
            title.textContent = 'Add Timeline Item';
            idInput.value = '';
        }

        modal.classList.add('active');
    }

    document.getElementById('timelineForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('timelineId').value;
        const isEdit = !!id;

        const data = {
            item_type: document.getElementById('timelineType').value,
            period: document.getElementById('timelinePeriod').value,
            title: document.getElementById('timelineTitle').value,
            organization: document.getElementById('timelineOrg').value,
            description: document.getElementById('timelineDesc').value,
            icon: document.getElementById('timelineIcon').value,
            sort_order: 10
        };

        const url = isEdit ? `/api/timeline/${id}` : '/api/timeline/';
        const method = isEdit ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showToast(`Timeline item ${isEdit ? 'updated' : 'added'} successfully!`);
                closeModal('timelineModal');
                setTimeout(() => location.reload(), 1000);
            } else {
                showToast('Operation failed', 'error');
            }
        } catch (e) {
            showToast('Error saving timeline item', 'error');
        }
    });

    async function deleteTimelineItem(id) {
        if (!confirm('Are you sure you want to delete this item?')) return;
        const response = await fetch(`/api/timeline/${id}`, { method: 'DELETE' });
        if (response.ok) {
            showToast('Item deleted');
            setTimeout(() => location.reload(), 500);
        } else {
            showToast('Delete failed', 'error');
        }
    }

    // --- Contact Logic ---
    function openContactModal(contact = null) {
        const modal = document.getElementById('contactModal');
        const title = document.getElementById('contactModalTitle');
        const idInput = document.getElementById('contactId');

        document.getElementById('contactForm').reset();

        if (contact) {
            title.textContent = 'Edit Contact';
            idInput.value = contact.id;
            document.getElementById('contactType').value = contact.contact_type;
            document.getElementById('contactLabel').value = contact.label;
            document.getElementById('contactValue').value = contact.value;
            document.getElementById('contactLink').value = contact.link || '';
        } else {
            title.textContent = 'Add Contact';
            idInput.value = '';
        }

        modal.classList.add('active');
    }

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('contactId').value;
        const isEdit = !!id;

        const data = {
            contact_type: document.getElementById('contactType').value,
            label: document.getElementById('contactLabel').value,
            value: document.getElementById('contactValue').value,
            link: document.getElementById('contactLink').value,
            icon: "default",
            sort_order: 10
        };

        const url = isEdit ? `/api/contact/${id}` : '/api/contact/';
        const method = isEdit ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showToast(`Contact ${isEdit ? 'updated' : 'added'} successfully!`);
                closeModal('contactModal');
                setTimeout(() => location.reload(), 1000);
            } else {
                showToast('Operation failed', 'error');
            }
        } catch (e) {
            showToast('Error saving contact', 'error');
        }
    });

    async function deleteContact(id) {
        if (!confirm('Are you sure you want to delete this contact?')) return;
        const response = await fetch(`/api/contact/${id}`, { method: 'DELETE' });
        if (response.ok) {
            showToast('Contact deleted');
            setTimeout(() => location.reload(), 500);
        } else {
            showToast('Delete failed', 'error');
        }
    }

    // Nav Logic
    document.querySelectorAll('.admin-nav-link').forEach(link => {
        link.addEventListener('click', (e) => {
            document.querySelectorAll('.admin-nav-link').forEach(l => l.classList.remove('active'));
            link.classList.add('active');
        });
    });
</script>
