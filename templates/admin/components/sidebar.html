<aside class="admin-sidebar">
    <a href="/" class="admin-brand">
        <span class="admin-brand-text">Portfolio</span>
        <span class="admin-brand-dot"></span>
    </a>

    <div class="admin-user">
        <div class="admin-user-name">{{ current_user.username }}</div>
        <div class="admin-user-role">
            {% if current_user.is_admin %}
            <span class="badge badge-admin">Admin</span>
            {% else %}
            User
            {% endif %}
        </div>
    </div>

    <ul class="admin-nav">
        <li class="admin-nav-item">
            <a href="#profile" class="admin-nav-link active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Profile
            </a>
        </li>
        <li class="admin-nav-item">
            <a href="#skills" class="admin-nav-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                Skills
            </a>
        </li>
        <li class="admin-nav-item">
            <a href="#projects" class="admin-nav-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                Projects
            </a>
        </li>
        <li class="admin-nav-item">
            <a href="#timeline" class="admin-nav-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                Timeline
            </a>
        </li>
        <li class="admin-nav-item">
            <a href="#contacts" class="admin-nav-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                Contact Info
            </a>
        </li>
    </ul>
</aside>
