<!-- Timeline Section -->
<section class="admin-section" id="timeline">
    <div class="admin-section-header">
        <h2 class="admin-section-title">Timeline</h2>
        <button class="btn-add" onclick="openTimelineModal()">+ Add Item</button>
    </div>
    <table class="admin-table">
        <thead>
            <tr>
                <th>Period</th>
                <th>Title</th>
                <th>Organization</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="timelineTableBody">
            {% for item in timeline_items %}
            <tr data-id="{{ item.id }}" data-json='{{ item | tojson | forceescape }}'>
                <td>{{ item.period }}</td>
                <td>{{ item.title }}</td>
                <td>{{ item.organization }}</td>
                <td>
                    {% if item.item_type == 'education' %}
                    <span class="badge badge-learning">Education</span>
                    {% else %}
                    <span class="badge badge-admin">Work</span>
                    {% endif %}
                </td>
                <td class="action-btns">
                    <button class="btn-sm btn-sm-edit"
                        onclick='openTimelineModal(JSON.parse(this.closest("tr").dataset.json))'>Edit</button>
                    <button class="btn-sm btn-sm-delete" onclick="deleteTimelineItem({{ item.id }})">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
